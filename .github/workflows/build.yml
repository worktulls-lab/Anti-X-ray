name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B -U -f TarkMullAntiXray/pom.xml clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: TarkMullAntiXray
          path: TarkMullAntiXray/target/TarkMullAntiXray-*.jar
          if-no-files-found: error
